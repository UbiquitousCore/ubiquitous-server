services:
  # Writes the database password once into a volume, so nothing on the host has
  # to generate it. A POSTGRES_PASSWORD already in .env is kept, because an
  # existing database was created with it.
  secrets:
    image: alpine:3.20
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    command:
      - sh
      - -c
      - |
        set -eu
        f=/secrets/postgres_password
        [ -s "$$f" ] && exit 0
        umask 022
        if [ -n "$$POSTGRES_PASSWORD" ]; then printf '%s' "$$POSTGRES_PASSWORD" > "$$f"
        else tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 32 > "$$f"; fi
        echo "generated the database password"
    volumes:
      - ubiquitous-secrets:/secrets

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ubiquitous
      POSTGRES_PASSWORD_FILE: /run/ubiquitous/postgres_password
      POSTGRES_DB: ubiquitous
    depends_on:
      secrets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ubiquitous -d ubiquitous"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ubiquitous-secrets:/run/ubiquitous:ro
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    environment:
      UBIQUITOUS_BIND_ADDRESS: 0.0.0.0
      # No `:-default` fallbacks here on purpose: an unset variable arrives
      # empty, which the server reads as "not said", so server.json (when
      # mounted) or the built-in default applies. Anything set here or in
      # .env still wins over server.json.
      UBIQUITOUS_WEBSOCKET_PORT: ${UBIQUITOUS_WEBSOCKET_PORT:-}
      UBIQUITOUS_DATA_DIRECTORY: /data/generated
      UBIQUITOUS_STATE_DIRECTORY: /data/state
      UBIQUITOUS_FESTIVAL_CONTENT_ENABLED: ${UBIQUITOUS_FESTIVAL_CONTENT_ENABLED:-}
      UBIQUITOUS_MODULE_PLAYERBOTS_ENABLED: ${UBIQUITOUS_MODULE_PLAYERBOTS_ENABLED:-}
      UBIQUITOUS_MODULE_PLAYERBOTS_RANDOM_BOT_COUNT: ${UBIQUITOUS_MODULE_PLAYERBOTS_RANDOM_BOT_COUNT:-}
      UBIQUITOUS_POSTGRES_CONNECTION_STRING: "Host=db;Username=ubiquitous;Database=ubiquitous"
      UBIQUITOUS_POSTGRES_PASSWORD_FILE: /run/ubiquitous/postgres_password
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Loopback only by default; set UBIQUITOUS_PUBLISH_ADDRESS=0.0.0.0 to serve a LAN.
      - "${UBIQUITOUS_PUBLISH_ADDRESS:-127.0.0.1}:${UBIQUITOUS_WEBSOCKET_PORT:-8781}:${UBIQUITOUS_WEBSOCKET_PORT:-8781}"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:${UBIQUITOUS_WEBSOCKET_PORT:-8781}/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - ./data/generated:/data/generated:ro
      - ubiquitous-state:/data/state
      - ubiquitous-secrets:/run/ubiquitous:ro
    restart: unless-stopped

  # `./run.sh ingest`: turns incoming/*.ipa into data/generated/ with nothing
  # installed on the host. Not started by `up`.
  ingest:
    profiles: ["ingest"]
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    user: "${UBIQUITOUS_UID:-0}:${UBIQUITOUS_GID:-0}"
    environment:
      HOME: /tmp
    volumes:
      - ./incoming:/work/incoming
      - ./data:/work/data

volumes:
  postgres-data:
  ubiquitous-state:
  ubiquitous-secrets:
