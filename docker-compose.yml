services:
  # Writes the database password once into a volume, so nothing on the host has
  # to generate it. A POSTGRES_PASSWORD already in .env is kept, because an
  # existing database was created with it.
  secrets:
    image: alpine:3.20
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    command:
      - sh
      - -c
      - |
        set -eu
        f=/secrets/postgres_password
        [ -s "$$f" ] && exit 0
        umask 022
        if [ -n "$$POSTGRES_PASSWORD" ]; then printf '%s' "$$POSTGRES_PASSWORD" > "$$f"
        else tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 32 > "$$f"; fi
        echo "generated the database password"
    volumes:
      - ubiquitous-secrets:/secrets

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ubiquitous
      POSTGRES_PASSWORD_FILE: /run/ubiquitous/postgres_password
      POSTGRES_DB: ubiquitous
    depends_on:
      secrets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ubiquitous -d ubiquitous"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ubiquitous-secrets:/run/ubiquitous:ro
    restart: unless-stopped

  # Pulled from GHCR; `up --build` builds it from this checkout instead.
  server:
    image: ghcr.io/ubiquitouscore/ubiquitous-server:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    environment:
      UBIQUITOUS_BIND_ADDRESS: 0.0.0.0
      # No `:-default` fallbacks here on purpose: an unset variable arrives
      # empty, which the server reads as "not said", so server.json (when
      # mounted) or the built-in default applies. Anything set here or in
      # .env still wins over server.json.
      UBIQUITOUS_WEBSOCKET_PORT: ${UBIQUITOUS_WEBSOCKET_PORT:-}
      UBIQUITOUS_DATA_DIRECTORY: /data/generated
      UBIQUITOUS_STATE_DIRECTORY: /data/state
      UBIQUITOUS_FESTIVAL_CONTENT_ENABLED: ${UBIQUITOUS_FESTIVAL_CONTENT_ENABLED:-}
      UBIQUITOUS_MODULE_PLAYERBOTS_ENABLED: ${UBIQUITOUS_MODULE_PLAYERBOTS_ENABLED:-}
      UBIQUITOUS_MODULE_PLAYERBOTS_RANDOM_BOT_COUNT: ${UBIQUITOUS_MODULE_PLAYERBOTS_RANDOM_BOT_COUNT:-}
      UBIQUITOUS_POSTGRES_CONNECTION_STRING: "Host=db;Username=ubiquitous;Database=ubiquitous"
      UBIQUITOUS_POSTGRES_PASSWORD_FILE: /run/ubiquitous/postgres_password
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Loopback only by default; set UBIQUITOUS_PUBLISH_ADDRESS=0.0.0.0 to serve a LAN.
      - "${UBIQUITOUS_PUBLISH_ADDRESS:-127.0.0.1}:${UBIQUITOUS_WEBSOCKET_PORT:-8781}:${UBIQUITOUS_WEBSOCKET_PORT:-8781}"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:${UBIQUITOUS_WEBSOCKET_PORT:-8781}/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - ./data/generated:/data/generated:ro
      - ubiquitous-state:/data/state
      - ubiquitous-secrets:/run/ubiquitous:ro
    restart: unless-stopped

  # `docker compose up dev`: the server from this checkout under dotnet watch,
  # with no .NET on the host. Like a native `dotnet run`, it saves to editable
  # JSON files in data/generated and reads the development logins from .env.
  # Run it instead of the stack above, not beside it: both use the same port.
  dev:
    profiles: ["dev"]
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /src
    environment:
      UBIQUITOUS_BIND_ADDRESS: 0.0.0.0
      UBIQUITOUS_WEBSOCKET_PORT: "8781"
      UBIQUITOUS_POSTGRES_CONNECTION_STRING: ""
      # Bind mounts from macOS and Windows do not deliver change events.
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      # Build output goes to a volume, so the container and a build on the
      # host never overwrite each other's bin/ and obj/.
      UseArtifactsOutput: "true"
      ArtifactsPath: /artifacts
    command: ["dotnet", "watch", "--project", "src/server", "--non-interactive", "run"]
    ports:
      - "127.0.0.1:${UBIQUITOUS_WEBSOCKET_PORT:-8781}:8781"
    volumes:
      - .:/src
      - dev-artifacts:/artifacts
      - dev-nuget:/root/.nuget/packages

  # The built ubiquitous-client: static files, served only through the proxy.
  client:
    image: ghcr.io/ubiquitouscore/ubiquitous-client:latest
    restart: unless-stopped

  # The one address players open. Browsers keep the unpacked game data only
  # for a page on https (or localhost), and an https page may only open a wss
  # socket, so the client and the game socket share this origin and its
  # certificate. Caddy makes its own for localhost and IP addresses, and gets
  # a real one for a public domain.
  proxy:
    image: caddy:2-alpine
    environment:
      UBIQUITOUS_SITE: ${UBIQUITOUS_SITE:-localhost}
      UBIQUITOUS_WEBSOCKET_PORT: ${UBIQUITOUS_WEBSOCKET_PORT:-8781}
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    ports:
      - "${UBIQUITOUS_HTTPS_PORT:-443}:443"
      - "${UBIQUITOUS_HTTP_PORT:-80}:80"
    volumes:
      # Holds the certificate authority a phone is told to trust; losing it
      # means installing a new one on every device.
      - caddy-data:/data
    depends_on:
      - client
      - server
    restart: unless-stopped

  # `docker compose run --rm ingest`: turns incoming/*.ipa into data/generated/.
  # Not started by `up`. On Linux, set UBIQUITOUS_UID/GID to your own ids so
  # the files it writes are yours rather than root's.
  ingest:
    profiles: ["ingest"]
    image: ghcr.io/ubiquitouscore/ubiquitous-server-ingest:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: ingest
    user: "${UBIQUITOUS_UID:-0}:${UBIQUITOUS_GID:-0}"
    volumes:
      - ./incoming:/work/incoming
      - ./data:/work/data

configs:
  caddyfile:
    content: |
      {
      	# A browser sends no server name when it is given an IP address.
      	default_sni {$$UBIQUITOUS_SITE}
      }

      (app) {
      	handle_path /ubiquitous-server* {
      		reverse_proxy server:{$$UBIQUITOUS_WEBSOCKET_PORT}
      	}
      	handle /root.crt {
      		root * /data/caddy/pki/authorities/local
      		file_server
      	}
      	handle {
      		reverse_proxy client:8780
      	}
      }

      # This machine needs no certificate: browsers already treat
      # http://localhost as secure.
      http://localhost {
      	import app
      }

      localhost, {$$UBIQUITOUS_SITE} {
      	import app
      }

volumes:
  postgres-data:
  ubiquitous-state:
  ubiquitous-secrets:
  caddy-data:
  dev-artifacts:
  dev-nuget:
