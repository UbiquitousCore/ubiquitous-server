# Reads the shared game settings (bots, festival items, ports) from server.json
# inside the container; environment variables still win over the file. Add it
# with COMPOSE_FILE=docker-compose.yml:docker-compose.server-json.yml in .env.
# Kept separate so a folder without server.json still composes.
services:
  server:
    environment:
      UBIQUITOUS_CONFIG: /config/server.json
    volumes:
      - ./server.json:/config/server.json:ro
